name: Build and Publish

# CI builds/pushes the images and publishes the Helm chart (OCI) to GHCR. Nothing is committed back.
# Deploying is ArgoCD's job: it follows the chart published for each release.
#
# - catalog-service / stock-service / customer-service: the manifest is generated by the Quarkus
#   kubernetes extension (target/kubernetes/kubernetes.yml) with the image tag already set to the
#   release tag. The chart job embeds it in the chart (files/<service>.yaml) and the chart
#   templates adjust it at render time (see .devops/helm/templates/java-services.yaml).
# - frontend and erp-secrets: hand-written templates in the chart; the frontend image tag is the
#   chart appVersion.

on:
  # Release pipeline: creating a tag like v1.2.3 builds and publishes the images
  # tagged with that version (semver, which is what the Image Updater expects).
  push:
    tags: ['v*.*.*']
  # PRs only build (validates Dockerfiles), nothing is pushed.
  pull_request:
    branches: [main]

env:
  IMAGE_PREFIX: ghcr.io/openlab-software
  # Helm chart OCI: publicado como ghcr.io/openlab-software/charts/erp
  CHART_REPO: ghcr.io/openlab-software/charts
  # Git tag on release pushes; commit sha on PR builds (never pushed).
  IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

jobs:
  java-service:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-service, stock-service, customer-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Generates target/kubernetes/kubernetes.yml. Tests run elsewhere; this only
      # needs the build-time manifest generation.
      - name: Generate Kubernetes manifest
        working-directory: ${{ matrix.service }}
        run: >
          mvn -B package -DskipTests
          -Dquarkus.container-image.registry=ghcr.io
          -Dquarkus.container-image.group=openlab-software
          -Dquarkus.container-image.tag=${{ env.IMAGE_TAG }}

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.service }}
          path: ${{ matrix.service }}/target/kubernetes/kubernetes.yml
          if-no-files-found: error

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On PRs the image is only built (validates the Dockerfile), not pushed.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/src/main/docker/Dockerfile.jvm
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/docker/Dockerfile.frontend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}/frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  chart:
    needs: [java-service, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      # One artifact per matrix entry of `java-service`: manifests/manifest-<service>/
      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: manifests

      # Generated manifests go into the chart (not versioned); the chart adjusts them at render time.
      - name: Stage generated manifests into the chart
        run: |
          mkdir -p .devops/helm/files
          for dir in manifests/manifest-*/; do
            service="${dir#manifests/manifest-}"
            service="${service%/}"
            cp "${dir}kubernetes.yml" ".devops/helm/files/${service}.yaml"
          done

      # PRs and releases: validate the chart and make sure it renders
      - name: Lint and template
        run: |
          helm lint .devops/helm
          helm template erp .devops/helm --namespace erp > /dev/null

      - name: Log in to registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Chart version = tag without the "v" (v1.2.3 -> 1.2.3); appVersion = tag, which is the frontend image tag
      - name: Package and push chart
        if: github.event_name == 'push'
        run: |
          helm package .devops/helm --version "${IMAGE_TAG#v}" --app-version "${IMAGE_TAG}"
          helm push "erp-${IMAGE_TAG#v}.tgz" "oci://${CHART_REPO}"
