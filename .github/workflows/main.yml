name: Build, Publish and Bump manifests

# CI builds/pushes images and commits the Kubernetes manifests into .devops/k8s.
# Deploying is ArgoCD's job: it watches .devops/k8s and syncs the cluster.
#
# - catalog-service / stock-service: the manifest is generated by the Quarkus
#   kubernetes extension (target/kubernetes/kubernetes.yml) with the image tag
#   already set to the release tag, then copied to .devops/k8s/<service>/kubernetes.yaml.
# - frontend: manifest is hand-written; its tag is rewritten in kustomization.yaml.

on:
  # Release pipeline: creating a tag like v1.2.3 builds and publishes the images
  # tagged with that version (semver, which is what the Image Updater expects).
  push:
    tags: ['v*.*.*']
  # PRs only build (validates Dockerfiles), nothing is pushed.
  pull_request:
    branches: [main]

env:
  IMAGE_PREFIX: ghcr.io/openlab-software
  # Git tag on release pushes; commit sha on PR builds (never pushed).
  IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

jobs:
  java-service:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-service, stock-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Generates target/kubernetes/kubernetes.yml. Tests run elsewhere; this only
      # needs the build-time manifest generation.
      - name: Generate Kubernetes manifest
        working-directory: ${{ matrix.service }}
        run: >
          mvn -B package -DskipTests
          -Dquarkus.container-image.registry=ghcr.io
          -Dquarkus.container-image.group=openlab-software
          -Dquarkus.container-image.tag=${{ env.IMAGE_TAG }}

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.service }}
          path: ${{ matrix.service }}/target/kubernetes/kubernetes.yml
          if-no-files-found: error

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On PRs the image is only built (validates the Dockerfile), not pushed.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/src/main/docker/Dockerfile.jvm
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/docker/Dockerfile.frontend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}/frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  bump-manifests:
    needs: [java-service, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize bumps so concurrent pushes don't race on the manifests commit.
    concurrency:
      group: bump-manifests
      cancel-in-progress: false
    steps:
      # A tag push checks out a detached HEAD; bump on top of main instead.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: manifests

      - name: Update manifests
        run: |
          # One artifact per matrix entry of `java-service`: manifests/manifest-<service>/
          for dir in manifests/manifest-*/; do
            service="${dir#manifests/manifest-}"
            service="${service%/}"
            cp "${dir}kubernetes.yml" ".devops/k8s/${service}/kubernetes.yaml"
          done
          cd .devops/k8s
          # kustomize is preinstalled on ubuntu-latest runners
          kustomize edit set image \
            "${IMAGE_PREFIX}/frontend=${IMAGE_PREFIX}/frontend:${IMAGE_TAG}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .devops/k8s
          git diff --cached --quiet && exit 0
          git commit -m "chore(k8s): deploy ${IMAGE_TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
