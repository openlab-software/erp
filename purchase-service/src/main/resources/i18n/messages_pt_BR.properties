# Mensagens de erro e validacao (pt-BR) - arquivo em UTF-8.
# Formato java.text.MessageFormat: {0}, {1} sao argumentos; aspas simples devem ser duplicadas ('').

# --- Generico -----------------------------------------------------------------
error.internal=erro interno do servidor
error.json.malformed=corpo da requisição JSON inválido
error.id.invalid=id inválido: esperado formato ''{0}''
error.pageSize.max=page_size não pode ser maior que {0}
error.field.required={0} é obrigatório
error.field.blank={0} não pode estar em branco
error.field.invalid={0} inválido: ''{1}''

# --- Compras ------------------------------------------------------------------
error.order.notFound=ordem de compra não encontrada: {0}
error.order.notEditable=a ordem está {0} e não pode mais ser alterada
error.order.notDraft=só um pedido de cotação em rascunho pode ser marcado como enviado (estado atual: {0})
error.order.notConfirmed=só uma ordem confirmada pode ser bloqueada (estado atual: {0})
error.order.notCancelled=só uma ordem cancelada pode voltar para rascunho (estado atual: {0})
error.order.notDeletable=só é possível excluir ordens em rascunho ou canceladas (estado atual: {0})
error.order.empty=a ordem precisa de ao menos uma linha
error.order.alreadyCancelled=a ordem já está cancelada
error.order.locked=a ordem está bloqueada e não pode ser cancelada
error.order.hasFulfilment=a ordem já tem recebimento ou fatura do fornecedor e não pode ser cancelada
error.order.line.quantity=a quantidade da linha deve ser maior que zero
error.order.line.tooMany=a ordem pode ter no máximo {0} linhas

# --- Validacao de payload -----------------------------------------------------
validation.summary=Um ou mais campos são inválidos
validation.required=Este campo é obrigatório.
validation.min=O valor deve ser maior ou igual a {0}.
validation.max=O valor deve ser menor ou igual a {0}.
validation.positive=O valor deve ser maior que zero.
validation.positiveOrZero=O valor não pode ser negativo.
validation.size.min=Este campo deve ter no mínimo {0} caracteres.
validation.size.max=Este campo deve ter no máximo {0} caracteres.
validation.size.range=Este campo deve ter entre {0} e {1} caracteres.
