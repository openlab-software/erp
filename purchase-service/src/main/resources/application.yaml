quarkus:
  application:
    name: purchase-service
  http:
    port: 8085

  # --- Observabilidade (infrastructure: componentes monitoring, loki, tempo, opentelemetry) ---
  # Métricas: Micrometer em /q/metrics, coletado pelo ServiceMonitor (.devops/helm/templates/observability.yaml).
  # Traces: OpenTelemetry -> coletor OTLP. Fora do cluster fica desligado; o k8s liga abaixo.
  # Logs: stdout (o agente OpenTelemetry coleta), com traceId/spanId para correlação no Grafana.
  otel:
    sdk:
      disabled: ${OTEL_SDK_DISABLED:true}
    exporter:
      otlp:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  micrometer:
    export:
      prometheus:
        enabled: true
  log:
    console:
      format: "%d{HH:mm:ss.SSS} %-5p traceId=%X{traceId} spanId=%X{spanId} [%c{2.}] (%t) %s%e%n"

  # --- Postgres / Hibernate ---
  # Same "erp" database used by the other services, own "purchase" schema.
  datasource:
    db-kind: postgresql
    username: ${POSTGRES_USER:root}
    password: "${POSTGRES_PASSWORD:Postgres123!}"
    jdbc:
      telemetry: true   # spans das queries JDBC
      url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:erp}
  hibernate-orm:
    database:
      default-schema: purchase
      # Schema is owned by Flyway migrations, not Hibernate.
      generation: none

  # --- Flyway ---
  flyway:
    baseline-on-migrate: true
    migrate-at-start: true
    schemas: purchase
    default-schema: purchase
    create-schemas: true

  # --- OpenAPI / Swagger UI ---
  smallrye-openapi:
    path: /docs/openapi
  swagger-ui:
    path: /docs
    always-include: true

  # --- Kubernetes (manifests generated at build into target/kubernetes) ---
  container-image:
    group: openlab
    name: purchase-service
  kubernetes:
    name: purchase-service
    namespace: ${K8S_NAMESPACE:erp}
    part-of: erp
    replicas: 2
    image-pull-policy: IfNotPresent
    service-type: ClusterIP
    service-account: purchase-service
    # Metricas coletadas pelo ServiceMonitor quarkus-services do repositorio infrastructure
    prometheus:
      generate-service-monitor: false
    ports:
      http:
        container-port: 8085
    env:
      vars:
        # Postgres e RabbitMQ sao do repositorio infrastructure (namespaces database e messaging)
        POSTGRES_HOST: postgres.database.svc.cluster.local
        POSTGRES_PORT: "5432"
        RABBITMQ_HOST: rabbitmq.messaging.svc.cluster.local
        # Fixed on purpose: Kubernetes injects POSTGRES_PORT=tcp://ip:port (service links),
        # which would otherwise override the numeric port.
        RABBITMQ_PORT: "5672"
        OTEL_SDK_DISABLED: "false"
        OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-gateway-collector.observability.svc.cluster.local:4317
      mapping:
        POSTGRES_PASSWORD:
          from-secret: erp-secrets
          with-key: postgres-password
        RABBITMQ_PASSWORD:
          from-secret: erp-secrets
          with-key: rabbitmq-password
    liveness-probe:
      http-action-path: /q/health/live
    readiness-probe:
      http-action-path: /q/health/ready

# --- RabbitMQ (quarkus-messaging-rabbitmq, see infra.messaging.RabbitMqPublisher) ---
rabbitmq-host: ${RABBITMQ_HOST:localhost}
rabbitmq-port: ${RABBITMQ_PORT:5672}
rabbitmq-username: ${RABBITMQ_USER:root}
rabbitmq-password: "${RABBITMQ_PASSWORD:RabbitMQ123!}"

mp:
  messaging:
    outgoing:
      # Publishes with a per-message routing key to the durable topic exchange.
      purchase-events:
        connector: smallrye-rabbitmq
        exchange:
          name: purchase.events
          type: topic
          durable: true
    incoming:
      # Optional integrations (see infra.messaging.IntegrationEventsConsumer): the inventory module reports
      # validated receipts and the accounting module posted vendor bills. Each consumer declares the
      # producer's exchange itself, so purchase starts the same whether or not those modules are deployed.
      stock-events:
        connector: smallrye-rabbitmq
        exchange:
          name: stock.events
          type: topic
          durable: true
        queue:
          name: purchase-subscriber-stock
          durable: true
        routing-keys: picking.done
        max-outstanding-messages: 10
        failure-strategy: reject
      accounting-events:
        connector: smallrye-rabbitmq
        exchange:
          name: accounting.events
          type: topic
          durable: true
        queue:
          name: purchase-subscriber-accounting
          durable: true
        routing-keys: invoice.posted
        max-outstanding-messages: 10
        failure-strategy: reject
  openapi:
    extensions:
      smallrye:
        info:
          title: Purchase Service API
          version: "1.0"
          description: Servico de compras (RFQ e ordens de compra) dentro do ERP.

purchase:
  outbox:
    # In-process @Scheduled job, see infra.messaging.OutboxRelayJob.
    relay-interval: 5s

app:
  i18n:
    # Fallback when Accept-Language is absent/unsupported. Bundles: i18n/messages_{pt_BR,en}.properties
    default-locale: pt-BR

"%dev":
  quarkus:
    log:
      level: INFO
