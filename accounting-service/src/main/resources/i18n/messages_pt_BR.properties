# Mensagens de erro e validacao (pt-BR) - arquivo em UTF-8.
# Formato java.text.MessageFormat: {0}, {1} sao argumentos; aspas simples devem ser duplicadas ('').

# --- Generico -----------------------------------------------------------------
error.internal=erro interno do servidor
error.json.malformed=corpo da requisição JSON inválido
error.id.invalid=id inválido: esperado formato ''{0}''
error.pageSize.max=page_size não pode ser maior que {0}
error.field.required={0} é obrigatório
error.field.blank={0} não pode estar em branco
error.field.invalid={0} inválido: ''{1}''

# --- Financeiro ---------------------------------------------------------------
error.invoice.notFound=fatura não encontrada: {0}
error.invoice.notDraft=a fatura está {0} e só rascunhos podem ser alterados
error.invoice.notPosted=só uma fatura lançada aceita pagamentos (estado atual: {0})
error.invoice.notCancelled=só uma fatura cancelada pode voltar para rascunho (estado atual: {0})
error.invoice.notDeletable=só rascunhos que nunca foram numerados podem ser excluídos (estado atual: {0})
error.invoice.empty=a fatura precisa de ao menos uma linha
error.invoice.zeroTotal=a fatura não pode ser lançada com total zerado
error.invoice.alreadyCancelled=a fatura já está cancelada
error.invoice.hasPayments=a fatura tem pagamentos registrados e não pode ser cancelada
error.invoice.dueBeforeDate=o vencimento não pode ser anterior à data da fatura
error.invoice.line.quantity=a quantidade da linha deve ser maior que zero
error.invoice.line.tooMany=a fatura pode ter no máximo {0} linhas
error.payment.amount=o valor do pagamento deve ser maior que zero
error.payment.exceedsResidual=o pagamento excede o saldo em aberto ({0})

# --- Validacao de payload -----------------------------------------------------
validation.summary=Um ou mais campos são inválidos
validation.required=Este campo é obrigatório.
validation.min=O valor deve ser maior ou igual a {0}.
validation.max=O valor deve ser menor ou igual a {0}.
validation.positive=O valor deve ser maior que zero.
validation.positiveOrZero=O valor não pode ser negativo.
validation.size.min=Este campo deve ter no mínimo {0} caracteres.
validation.size.max=Este campo deve ter no máximo {0} caracteres.
validation.size.range=Este campo deve ter entre {0} e {1} caracteres.
