# Mensagens de erro e validacao (pt-BR) - arquivo em UTF-8.
# Formato java.text.MessageFormat: {0}, {1} sao argumentos; aspas simples devem ser duplicadas ('').

# --- Generico -----------------------------------------------------------------
error.internal=erro interno do servidor
error.json.malformed=corpo da requisição JSON inválido
error.id.invalid=id inválido: esperado formato ''{0}''
error.pageSize.max=page_size não pode ser maior que {0}
error.field.required={0} é obrigatório
error.field.blank={0} não pode estar em branco
error.field.negative={0} não pode ser negativo
error.field.invalid={0} inválido: ''{1}''

# --- Referencias invalidas ----------------------------------------------------
error.ref.category={0} não corresponde a uma categoria existente
error.ref.unitOfMeasure={0} não corresponde a uma unidade de medida existente
error.ref.brand={0} não corresponde a uma marca existente
error.ref.supplier={0} não corresponde a um fornecedor existente

# --- Marca --------------------------------------------------------------------
error.brand.duplicate=já existe uma marca com essa descrição
error.brand.notFound=marca não encontrada: {0}
error.brand.hasProducts=marca possui produtos associados e não pode ser removida

# --- Categoria ----------------------------------------------------------------
error.category.duplicate=já existe uma categoria com essa descrição
error.category.notFound=categoria não encontrada: {0}
error.category.hasChildren=categoria possui subcategorias e não pode ser removida
error.category.hasProducts=categoria possui produtos associados e não pode ser removida
error.category.cycle={0} introduz um ciclo na hierarquia de categorias

# --- Fornecedor ---------------------------------------------------------------
error.supplier.duplicate=já existe um fornecedor com esse document
error.supplier.notFound=fornecedor não encontrado: {0}
error.supplier.hasProducts=fornecedor possui produtos associados e não pode ser removido

# --- Unidade de medida --------------------------------------------------------
error.unitOfMeasure.duplicate=já existe uma unidade de medida com esse code
error.unitOfMeasure.notFound=unidade de medida não encontrada: {0}
error.unitOfMeasure.hasProducts=unidade de medida possui produtos associados e não pode ser removida

# --- Produto ------------------------------------------------------------------
error.product.notFound=produto não encontrado: {0}
error.product.statusTransition=transição de status não permitida: {0} -> {1}
error.barcode.duplicate=já existe um código de barras com esse code
error.barcode.notFound=código de barras não encontrado: {0}
error.image.invalidUrl=url mal formada
error.image.notFound=imagem não encontrada: {0}
error.attribute.blank=name e value dos atributos não podem estar em branco
error.attribute.duplicate=name duplicado nos atributos: ''{0}''

# --- Importacao CSV -----------------------------------------------------------
error.csv.missing=arquivo CSV não enviado
error.csv.unreadable=não foi possível ler o arquivo enviado
error.csv.emptyOrInvalid=arquivo CSV vazio ou inválido
error.csv.missingDescription=arquivo CSV inválido: coluna ''description'' obrigatória não encontrada
error.import.uomCodeNotFound=unit_of_measure_code não encontrado: ''{0}''

# --- Validacao de payload (Bean Validation) -----------------------------------
validation.summary=Um ou mais campos são inválidos
validation.required=Este campo é obrigatório.
validation.min=O valor deve ser maior ou igual a {0}.
validation.max=O valor deve ser menor ou igual a {0}.
validation.positive=O valor deve ser maior que zero.
validation.positiveOrZero=O valor não pode ser negativo.
validation.size.min=Este campo deve ter no mínimo {0} caracteres.
validation.size.max=Este campo deve ter no máximo {0} caracteres.
validation.size.range=Este campo deve ter entre {0} e {1} caracteres.
