quarkus.application.name=catalog-service
quarkus.http.port=8080
quarkus.http.root-path=/catalog-service

# --- Postgres / Hibernate ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:root}
quarkus.datasource.password=${POSTGRES_PASSWORD:Postgres123!}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:erp}

quarkus.hibernate-orm.database.default-schema=catalog
# Schema is owned by Flyway migrations, not Hibernate.
quarkus.hibernate-orm.database.generation=none

# --- Flyway ---
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=catalog
quarkus.flyway.default-schema=catalog
quarkus.flyway.create-schemas=true

# --- RabbitMQ (raw amqp-client, see infra.messaging.RabbitMqPublisher) ---
catalog.rabbitmq.host=${RABBITMQ_HOST:localhost}
catalog.rabbitmq.port=${RABBITMQ_PORT:5672}
catalog.rabbitmq.username=${RABBITMQ_USER:root}
catalog.rabbitmq.password=${RABBITMQ_PASSWORD:RabbitMQ123!}
catalog.rabbitmq.exchange=catalog.events

# --- Outbox relay (in-process @Scheduled job, see infra.messaging.OutboxRelayJob) ---
catalog.outbox.relay-interval=5s

# --- OpenAPI / Swagger UI (equivalent to the Go service's swag-generated docs) ---
quarkus.smallrye-openapi.path=/docs/openapi
quarkus.swagger-ui.path=/docs
quarkus.swagger-ui.always-include=true
mp.openapi.extensions.smallrye.info.title=Catalog Service API
mp.openapi.extensions.smallrye.info.version=1.0
mp.openapi.extensions.smallrye.info.description=Servico responsavel por gerenciar o catalogo de produtos dentro do ERP.

%dev.quarkus.log.level=INFO

# --- i18n --------------------------------------------------------------------
# Fallback when Accept-Language is absent/unsupported. Bundles: i18n/messages_{pt_BR,en}.properties
app.i18n.default-locale=pt-BR
