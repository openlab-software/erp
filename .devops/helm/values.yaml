# Serviços Quarkus: o manifest de cada um é gerado no build (extensão kubernetes do Quarkus)
# e a CI o coloca em files/<serviço>.yaml antes do `helm package` (não é versionado).
# A tag da imagem já vem dentro desse manifest.
# Módulos do ERP (aplicativos, como no Odoo). Cada módulo agrupa os microserviços que dependem entre si e é
# descrito em modules/<nome>/module.json no repositório (dependências em `depends`, serviços em `services`).
# Ligue só os que o cliente contratou: as dependências obrigatórias entram sozinhas (ligar `sales` liga
# `contacts` e `products`). Os módulos listados em `integrates_with` conversam por eventos quando AMBOS
# estão instalados e não são necessários um ao outro (ex.: `sales` funciona sem `inventory`).
modules:
  contacts:   { enabled: true }   # customer-service
  products:   { enabled: true }   # catalog-service
  inventory:  { enabled: true }   # stock-service
  crm:        { enabled: true }   # crm-service
  sales:      { enabled: true }   # sales-service
  purchase:   { enabled: true }   # purchase-service
  accounting: { enabled: true }   # accounting-service

# O Job *-flyway-init é recriado a cada sync (hook do ArgoCD, Jobs são imutáveis) e tem prazo:
# se o pod não sobe (ex.: secret ausente), o Job falha em vez de deixar o sync pendurado.
flyway:
  activeDeadlineSeconds: 180

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/openlab-software/frontend
    # Vazio = usa .Chart.AppVersion (a tag da release, definida pela CI no package)
    tag: ""
    pullPolicy: IfNotPresent
  httproute:
    enabled: true
    # Gateway compartilhado (Istio) criado pelo componente `gateway` do repositório infrastructure
    gateway:
      name: main
      namespace: gateway-system
    hosts:
      # prod (MetalLB + proxy)
      - erp.patrick.dev.br
      # kind local (localtest.me resolve para 127.0.0.1)
      - erp.localtest.me
      - erp.openlab.software

# Postgres (namespace database) e RabbitMQ (namespace messaging) são do repositório infrastructure.
# As senhas deles vêm do Bitwarden; o Secret erp-secrets (ExternalSecret) as entrega aos serviços.
secrets:
  enabled: true
  # Secret do Bitwarden com a senha inicial (bitwarden_initial_password_secret_id no infrastructure)
  initialPasswordSecretId: 744291d6-7bba-4255-9a44-b4df00d9d819
  secretStore: { name: bitwarden, kind: ClusterSecretStore }
  refreshInterval: 1h
