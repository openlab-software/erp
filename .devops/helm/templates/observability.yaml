{{- if .Values.observability.enabled }}
# Prometheus (componente "monitoring" do repositório infrastructure) coleta /q/metrics
# dos serviços Quarkus (Micrometer). O Prometheus descobre ServiceMonitors de qualquer namespace.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: erp-quarkus-services
  namespace: {{ .Release.Namespace }}
  annotations:
    # Não falha o dry-run do sync se a CRD ainda não existir no cluster
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: erp
      app.kubernetes.io/managed-by: quarkus
  endpoints:
    - port: http
      path: /q/metrics
      interval: 30s
---
# Auto-instrumentação Node.js do frontend (BFF), injetada pelo OpenTelemetry Operator
# (componente "opentelemetry" do repositório infrastructure) nos pods com a anotação
# instrumentation.opentelemetry.io/inject-nodejs: "true" (ver frontend.yaml).
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: erp-nodejs
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # O auto-instrumentation do Node usa OTLP/HTTP (porta 4318 do coletor gateway)
  exporter:
    endpoint: http://otel-gateway-collector.observability.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1"
{{- end }}
