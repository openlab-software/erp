{{- if .Values.secrets.enabled }}
# Cria o Secret "erp-secrets" a partir do Bitwarden Secrets Manager (kind e prod).
# Postgres e RabbitMQ são instalados pelo repositório infrastructure (componentes postgres e
# rabbitmq) com a senha inicial do Bitwarden; aqui o erp lê a mesma senha para se conectar.
# Requer o ClusterSecretStore "bitwarden" (componente external_secrets do infrastructure).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: erp-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    # Primeiro: se o secret não existe no Bitwarden o sync falha aqui, com a causa visível
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef: {{- toYaml .Values.secrets.secretStore | nindent 4 }}
  target: { name: erp-secrets, creationPolicy: Owner }
  data:
    - secretKey: postgres-password
      remoteRef: { key: {{ .Values.secrets.initialPasswordSecretId }} }
    - secretKey: rabbitmq-password
      remoteRef: { key: {{ .Values.secrets.initialPasswordSecretId }} }
{{- end }}
