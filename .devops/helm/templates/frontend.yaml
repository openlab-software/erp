apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        # OpenTelemetry Operator injeta a auto-instrumentação Node.js; o Instrumentation "nodejs"
        # fica no namespace observability (componente opentelemetry do repositório infrastructure)
        instrumentation.opentelemetry.io/inject-nodejs: "observability/nodejs"
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            # Used only by the BFF (server side); the browser never sees these.
            # Cluster DNS: <service>.<namespace>.svc.cluster.local
            {{- /* uma <PREFIXO>_SERVICE_URL por serviço dos módulos ligados (o prefixo vem de bff_prefix do manifesto) */}}
            {{- range $svc := include "erp.services.enabled" . | fromJsonArray }}
            - name: {{ upper $svc.bff_prefix }}_SERVICE_URL
              value: http://{{ $svc.name }}.{{ $.Release.Namespace }}.svc.cluster.local
            {{- end }}
            {{- /* o BFF publica isto em /api/modules e o menu do frontend só mostra o que está instalado */}}
            - name: ERP_MODULES_JSON
              value: {{ include "erp.modules.manifests" . | quote }}
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.frontend.httproute.enabled }}
---
# Entra pelo Gateway compartilhado (Istio) do repositório infrastructure
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.frontend.httproute.gateway.name }}
      namespace: {{ .Values.frontend.httproute.gateway.namespace }}
  hostnames:
    {{- range .Values.frontend.httproute.hosts }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
{{- end }}
