apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: erp-secrets, namespace: erp }
# Cria o Secret "erp-secrets" a partir do Bitwarden Secrets Manager (kind e prod).
# Requer o ClusterSecretStore "bitwarden" (componente external_secrets do repositório
# infrastructure) e os secrets abaixo, pelo nome, no projeto Bitwarden configurado na store.
spec:
  refreshInterval: 1h
  secretStoreRef: { name: bitwarden, kind: ClusterSecretStore }
  target: { name: erp-secrets, creationPolicy: Owner }
  data:
    - secretKey: postgres-password
      remoteRef: { key: erp-postgres-password }
    - secretKey: rabbitmq-password
      remoteRef: { key: erp-rabbitmq-password }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: erp }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: root }
            - { name: POSTGRES_DB, value: erp }
            - name: POSTGRES_PASSWORD
              valueFrom:
                { secretKeyRef: { name: erp-secrets, key: postgres-password } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: erp }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: rabbitmq, namespace: erp }
spec:
  replicas: 1
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports: [{ containerPort: 5672 }, { containerPort: 15672 }]
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: root }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                { secretKeyRef: { name: erp-secrets, key: rabbitmq-password } }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq, namespace: erp }
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672 }
    - { name: management, port: 15672 }
