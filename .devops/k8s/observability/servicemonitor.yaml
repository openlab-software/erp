# Prometheus (componente "monitoring" do repositório infrastructure) coleta /q/metrics
# dos serviços Quarkus (Micrometer). O Prometheus descobre ServiceMonitors de qualquer namespace.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: erp-quarkus-services
  namespace: erp
  annotations:
    # Não falha o dry-run do sync se a CRD ainda não existir no cluster
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: erp
      app.kubernetes.io/managed-by: quarkus
  endpoints:
    - port: http
      path: /q/metrics
      interval: 30s
