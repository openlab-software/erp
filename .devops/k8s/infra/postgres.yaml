apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: erp
  annotations: { argocd.argoproj.io/sync-wave: "-1" }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: root }
            - { name: POSTGRES_DB, value: erp }
            - name: POSTGRES_PASSWORD
              valueFrom:
                { secretKeyRef: { name: erp-secrets, key: postgres-password } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: erp
  annotations: { argocd.argoproj.io/sync-wave: "-1" }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]