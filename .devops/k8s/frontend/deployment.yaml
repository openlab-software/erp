apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: erp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/openlab-software/frontend:1.0.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # Used only by the BFF (server side); the browser never sees these.
            # Cluster DNS: <service>.<namespace>.svc.cluster.local
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service.erp.svc.cluster.local/catalog-service
            - name: STOCK_SERVICE_URL
              value: http://stock-service.erp.svc.cluster.local
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: erp
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
