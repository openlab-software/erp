apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: erp
spec:
  # Mesma classe do ingress-nginx instalado pelo repositório infrastructure
  # (componente ingress_nginx; classe padrão "nginx").
  ingressClassName: nginx
  rules:
    # prod (MetalLB + proxy)
    - host: erp.patrick.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { name: http } }
    # kind local (localtest.me resolve para 127.0.0.1)
    - host: erp.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { name: http } }
    - host: openlab.software
      http:
        paths:
          - path: /erp
            pathType: Prefix
            backend:
              service: { name: frontend, port: { name: http } }