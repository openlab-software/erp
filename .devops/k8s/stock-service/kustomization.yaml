apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# kubernetes.yaml is generated by the Quarkus kubernetes extension and committed
# by the CI (image tag = commit sha). Do not edit it by hand.
resources:
  - kubernetes.yaml

patches:
  # Every Quarkus service generates a Role named "view-jobs" in the same namespace;
  # make it unique per service so they don't collide.
  - target:
      kind: Role
      name: view-jobs
    patch: |-
      - op: replace
        path: /metadata/name
        value: stock-service-view-jobs
  - target:
      kind: RoleBinding
      name: stock-service-view-jobs
    patch: |-
      - op: replace
        path: /roleRef/name
        value: stock-service-view-jobs
  # The Flyway Job is immutable once created, so a new image tag would fail the
  # sync. Run it as an Argo hook that is deleted and recreated on every sync.
  - target:
      kind: Job
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/hook: Sync
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
