---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    app.quarkus.io/quarkus-version: 3.38.3
    app.quarkus.io/commit-id: f68ef6d17428b48a222c6617115972293e6e22b6
    app.quarkus.io/vcs-uri: https://github.com/openlab-software/erp.git
    app.quarkus.io/build-timestamp: 2026-10-08 - 18:02:41 +0000
  labels:
    app.kubernetes.io/name: stock-service
    app.kubernetes.io/part-of: erp
    app.kubernetes.io/version: 1.0.0-SNAPSHOT
    app.kubernetes.io/managed-by: quarkus
  name: stock-service
  namespace: erp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: stock-service
      app.kubernetes.io/part-of: erp
      app.kubernetes.io/version: 1.0.0-SNAPSHOT
  template:
    metadata:
      annotations:
        app.quarkus.io/quarkus-version: 3.38.3
        app.quarkus.io/commit-id: f68ef6d17428b48a222c6617115972293e6e22b6
        app.quarkus.io/vcs-uri: https://github.com/openlab-software/erp.git
        app.quarkus.io/build-timestamp: 2026-10-08 - 18:02:41 +0000
      labels:
        app.kubernetes.io/managed-by: quarkus
        app.kubernetes.io/name: stock-service
        app.kubernetes.io/part-of: erp
        app.kubernetes.io/version: 1.0.0-SNAPSHOT
    spec:
      containers:
        - env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: QUARKUS_FLYWAY_ACTIVE
              value: "false"
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: postgres-password
                  name: erp-secrets
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: rabbitmq-password
                  name: erp-secrets
            - name: RABBITMQ_PORT
              value: "5672"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_HOST
              value: postgres
          image: ghcr.io/openlab-software/stock-service:v1.0.2
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /q/health/live
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
          name: stock-service
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /q/health/ready
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
          startupProbe:
            failureThreshold: 3
            httpGet:
              path: /q/health/started
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
      initContainers:
        - args:
            - job
            - stock-service-flyway-init
          image: groundnuty/k8s-wait-for:no-root-v1.7
          imagePullPolicy: Always
          name: wait-for-flyway
      serviceAccountName: stock-service
      terminationGracePeriodSeconds: 10
---
apiVersion: batch/v1
kind: Job
metadata:
  name: stock-service-flyway-init
  namespace: erp
spec:
  completionMode: NonIndexed
  selector: {}
  suspend: false
  template:
    metadata: {}
    spec:
      containers:
        - env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: postgres-password
                  name: erp-secrets
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: rabbitmq-password
                  name: erp-secrets
            - name: RABBITMQ_PORT
              value: "5672"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_HOST
              value: postgres
            - name: QUARKUS_INIT_AND_EXIT
              value: "true"
            - name: QUARKUS_FLYWAY_ACTIVE
              value: "true"
          image: ghcr.io/openlab-software/stock-service:v1.0.2
          name: stock-service-flyway-init
      restartPolicy: OnFailure
      serviceAccountName: stock-service
      terminationGracePeriodSeconds: 10
