apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ArgoCD detects this file and renders the directory with kustomize.
# catalog-service/ and stock-service/ hold manifests generated by the Quarkus
# kubernetes extension (committed by the CI); only the frontend tag lives here
# (kustomize edit set image).
resources:
- infra.yaml
- catalog-service
- stock-service
- frontend.yaml

images:
- name: ghcr.io/openlab-software/frontend
  newName: ghcr.io/openlab-software/frontend
  newTag: 8d9d5dec553719bf82413eaaff9f4a490ecafb95
