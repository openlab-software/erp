quarkus.application.name=stock-service
quarkus.http.port=8081

# --- Postgres --------------------------------------------------------------
# Same "erp" database used by catalog-service, own "stock" schema. Defaults below
# mirror apps/stock-service/.env.dev for local dev; override via real env vars in
# other environments.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:root}
quarkus.datasource.password=${POSTGRES_PASSWORD:Postgres123!}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:erp}

# Schema is fully managed by Flyway; Hibernate ORM must not attempt DDL (it would also
# try to validate catalog.products, which this service only reads and never migrates).
quarkus.hibernate-orm.schema-management.strategy=none

quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=stock
quarkus.flyway.default-schema=stock
quarkus.flyway.create-schemas=true

# --- RabbitMQ ----------------------------------------------------------------
# Read directly by software.openlab.stock.infra.messaging.RabbitMqGateway (plain
# amqp-client, no reactive-messaging connector) to mirror libs/go-common/rabbitmq.
rabbitmq.host=${RABBITMQ_HOST:localhost}
rabbitmq.port=${RABBITMQ_PORT:5672}
rabbitmq.username=${RABBITMQ_USER:root}
rabbitmq.password=${RABBITMQ_PASSWORD:RabbitMQ123!}

# --- Outbox relay --------------------------------------------------------------
stock.outbox.relay.interval=5s

# --- Jackson -------------------------------------------------------------------
# JSON field names follow snake_case (stock_id, page_size, from_stock_id, ...) while
# Java fields stay camelCase — matches the wire format already used by the Go services.
quarkus.jackson.property-naming-strategy=SNAKE_CASE

# --- OpenAPI / Swagger UI --------------------------------------------------------
quarkus.smallrye-openapi.info-title=Stock Service API
quarkus.smallrye-openapi.info-version=1.0
quarkus.smallrye-openapi.info-description=Servico responsavel por gerenciar estoques dentro do ERP.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/docs

%test.quarkus.flyway.migrate-at-start=false

# --- i18n --------------------------------------------------------------------
# Fallback when Accept-Language is absent/unsupported. Bundles: i18n/messages_{pt_BR,en}.properties
app.i18n.default-locale=pt-BR
