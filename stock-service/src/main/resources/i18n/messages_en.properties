# Error and validation messages (English) - UTF-8 file.
# java.text.MessageFormat syntax: {0}, {1} are arguments; single quotes must be doubled ('').

# --- Generic ------------------------------------------------------------------
error.internal=Internal error.
error.id.missing=invalid id: value is missing.
error.id.invalid=invalid id: expected format ''{0}''.
error.pageSize.max=page_size must be less than or equal to {0}.
error.quantity.positive=quantity must be a strictly positive integer.
error.field.invalidType=invalid {0}.
error.field.isoDateTime={0} must be a valid ISO-8601 date/time.

# --- Stock --------------------------------------------------------------------
error.stock.notFound=Stock not found.
error.stock.sourceNotFound=Source stock not found.
error.stock.targetNotFound=Destination stock not found.
error.stock.duplicate=A stock with this description already exists.
error.stock.hasBalance=Stock has items with a positive balance and cannot be removed.
error.stock.hasReserved=Stock has items with a reserved balance and cannot be removed.
error.stock.inReassignment=Stock is referenced by a reassignment and cannot be removed.

# --- Stock item ---------------------------------------------------------------
error.stockItem.notFound=Stock item not found for this product in this stock.
error.stockItem.notFoundInSource=Stock item not found for product {0} in the source stock.
error.stockItem.filterConflict=Cannot filter by below_min and above_max at the same time.
error.stockItem.releaseExceeds=quantity to release is greater than the current reserved balance.
error.stockItem.reserveExceeds=quantity to reserve is greater than the available balance.

# --- Movement -----------------------------------------------------------------
error.movement.negativeBalance=The movement would result in a negative balance.
error.movement.quantityPositive=quantity must be a strictly positive integer for {0}.
error.movement.quantityZero=quantity must not be zero for ADJUSTMENT.
error.movement.reasonRequired=reason_id is required for ADJUSTMENT.
error.movement.typeInvalid=type must be one of ENTRY, EXIT or ADJUSTMENT.

# --- Movement reason ----------------------------------------------------------
error.movementReason.notFound=Movement reason not found.
error.movementReason.duplicate=A movement reason with this description already exists.
error.movementReason.inUse=Movement reason is referenced by a stock movement and cannot be removed.
error.movementReason.refInvalid=reason_id does not match an existing movement reason.

# --- Count / reassignment -----------------------------------------------------
error.stockCount.valueInvalid=counted_value must be a non-negative integer.
error.reassignment.insufficientBalance=Insufficient balance for product {0} in the source stock.
error.product.notInCatalog=Product not found in the catalog: {0}

# --- Pickings (receipts, deliveries, internal transfers) ----------------------
error.picking.notFound=Transfer not found: {0}.
error.picking.typeInvalid=type must be one of RECEIPT, DELIVERY or INTERNAL.
error.picking.stateInvalid=state must be one of DRAFT, CONFIRMED, DONE or CANCELLED.
error.picking.sameStock=Source and destination of an internal transfer must be different stocks.
error.picking.demandPositive=The quantity of product {0} must be greater than zero.
error.picking.line.tooMany=A transfer can have at most {0} lines.
error.picking.notEditable=The transfer is {0} and can no longer be changed.
error.picking.notDraft=Only a draft transfer can be confirmed (current state: {0}).
error.picking.empty=The transfer needs at least one line.
error.picking.alreadyDone=The transfer was already validated and cannot be cancelled.
error.picking.alreadyCancelled=The transfer is already cancelled.
error.picking.notDeletable=Only draft or cancelled transfers can be deleted (current state: {0}).
error.picking.sourceRequired=Set the source stock before validating the transfer.
error.picking.destinationRequired=Set the destination stock before validating the transfer.
error.picking.productNotInPicking=Product {0} is not part of the transfer.
error.picking.doneInvalid=The done quantity of product {0} must be between 0 and the demand ({1}).
error.picking.nothingDone=Nothing was moved; cancel the transfer if it will not happen.

# --- Payload validation (Bean Validation) -------------------------------------
validation.summary=One or more fields are invalid
validation.required=This field is required.
validation.min=The value must be greater than or equal to {0}.
validation.max=The value must be less than or equal to {0}.
validation.positive=The value must be greater than zero.
validation.positiveOrZero=The value must not be negative.
validation.size.min=This field must have at least {0} characters.
validation.size.max=This field must have at most {0} characters.
validation.size.range=This field must have between {0} and {1} characters.
