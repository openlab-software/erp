# Mensagens de erro e validacao (pt-BR) - arquivo em UTF-8.
# Formato java.text.MessageFormat: {0}, {1} sao argumentos; aspas simples devem ser duplicadas ('').

# --- Generico -----------------------------------------------------------------
error.internal=Erro interno.
error.id.missing=id inválido: valor ausente.
error.id.invalid=id inválido: formato esperado ''{0}''.
error.pageSize.max=page_size deve ser menor ou igual a {0}.
error.quantity.positive=quantity deve ser um inteiro estritamente positivo.
error.field.invalidType={0} inválido.
error.field.isoDateTime={0} deve ser uma data/hora ISO-8601 válida.

# --- Estoque ------------------------------------------------------------------
error.stock.notFound=Estoque não encontrado.
error.stock.sourceNotFound=Estoque de origem não encontrado.
error.stock.targetNotFound=Estoque de destino não encontrado.
error.stock.duplicate=Já existe um estoque com esta descrição.
error.stock.hasBalance=Estoque possui itens com saldo positivo e não pode ser removido.
error.stock.hasReserved=Estoque possui itens com saldo reservado e não pode ser removido.
error.stock.inReassignment=Estoque é referenciado em um remanejamento e não pode ser removido.

# --- Item de estoque ----------------------------------------------------------
error.stockItem.notFound=Item de estoque não encontrado para este produto neste estoque.
error.stockItem.notFoundInSource=Item de estoque não encontrado para o produto {0} no estoque de origem.
error.stockItem.filterConflict=Não é possível filtrar por below_min e above_max ao mesmo tempo.
error.stockItem.releaseExceeds=quantity a liberar é maior que o saldo reservado atual.
error.stockItem.reserveExceeds=quantity a reservar é maior que o saldo disponível.

# --- Movimentacao -------------------------------------------------------------
error.movement.negativeBalance=A movimentação resultaria em saldo negativo.
error.movement.quantityPositive=quantity deve ser um inteiro estritamente positivo para {0}.
error.movement.quantityZero=quantity não pode ser zero para ADJUSTMENT.
error.movement.reasonRequired=reason_id é obrigatório para ADJUSTMENT.
error.movement.typeInvalid=type deve ser um de ENTRY, EXIT ou ADJUSTMENT.

# --- Motivo de movimentacao ---------------------------------------------------
error.movementReason.notFound=Motivo de movimentação não encontrado.
error.movementReason.duplicate=Já existe um motivo de movimentação com esta descrição.
error.movementReason.inUse=Motivo de movimentação é referenciado por uma movimentação de estoque e não pode ser removido.
error.movementReason.refInvalid=reason_id não corresponde a um motivo de movimentação existente.

# --- Contagem / remanejamento -------------------------------------------------
error.stockCount.valueInvalid=counted_value deve ser um inteiro não negativo.
error.reassignment.insufficientBalance=Saldo insuficiente para o produto {0} no estoque de origem.
error.product.notInCatalog=Produto não encontrado no catálogo: {0}

# --- Validacao de payload (Bean Validation) -----------------------------------
validation.summary=Um ou mais campos são inválidos
validation.required=Este campo é obrigatório.
validation.min=O valor deve ser maior ou igual a {0}.
validation.max=O valor deve ser menor ou igual a {0}.
validation.positive=O valor deve ser maior que zero.
validation.positiveOrZero=O valor não pode ser negativo.
validation.size.min=Este campo deve ter no mínimo {0} caracteres.
validation.size.max=Este campo deve ter no máximo {0} caracteres.
validation.size.range=Este campo deve ter entre {0} e {1} caracteres.
