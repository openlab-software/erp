quarkus:
  application:
    name: stock-service
  http:
    port: 8181

  # --- Postgres ---
  # Same "erp" database used by catalog-service, own "stock" schema. Defaults below
  # mirror apps/stock-service/.env.dev for local dev; override via real env vars in
  # other environments.
  # --- Observabilidade (infrastructure: componentes monitoring, loki, tempo, opentelemetry) ---
  # Métricas: Micrometer em /q/metrics, coletado pelo ServiceMonitor (.devops/helm/templates/observability.yaml).
  # Traces: OpenTelemetry -> coletor OTLP. Fora do cluster fica desligado; o k8s liga abaixo.
  # Logs: stdout (o agente OpenTelemetry coleta), com traceId/spanId para correlação no Grafana.
  otel:
    sdk:
      disabled: ${OTEL_SDK_DISABLED:true}
    exporter:
      otlp:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  micrometer:
    export:
      prometheus:
        enabled: true
  log:
    console:
      format: "%d{HH:mm:ss.SSS} %-5p traceId=%X{traceId} spanId=%X{spanId} [%c{2.}] (%t) %s%e%n"

  datasource:
    db-kind: postgresql
    username: ${POSTGRES_USER:root}
    password: "${POSTGRES_PASSWORD:Postgres123!}"
    jdbc:
      telemetry: true   # spans das queries JDBC
      url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:erp}
  hibernate-orm:
    # Schema is fully managed by Flyway; Hibernate ORM must not attempt DDL (it would also
    # try to validate catalog.products, which this service only reads and never migrates).
    schema-management:
      strategy: none
  flyway:
    baseline-on-migrate: true
    migrate-at-start: true
    schemas: stock
    default-schema: stock
    create-schemas: true

  # --- Jackson ---
  # JSON field names follow snake_case (stock_id, page_size, from_stock_id, ...) while
  # Java fields stay camelCase, matching the wire format already used by the Go services.
  jackson:
    property-naming-strategy: SNAKE_CASE

  # --- OpenAPI / Swagger UI ---
  smallrye-openapi:
    info-title: Stock Service API
    info-version: "1.0"
    info-description: Servico responsavel por gerenciar estoques dentro do ERP.
  swagger-ui:
    always-include: true
    path: /docs

  # --- Kubernetes (manifests generated at build into target/kubernetes) ---
  container-image:
    group: openlab
    name: stock-service
  kubernetes:
    name: stock-service
    namespace: ${K8S_NAMESPACE:erp}
    part-of: erp
    replicas: 2
    image-pull-policy: IfNotPresent
    service-type: ClusterIP
    service-account: stock-service
    # Métricas coletadas pelo ServiceMonitor quarkus-services do repositório infrastructure
    prometheus:
      generate-service-monitor: false
    ports:
      http:
        container-port: 8181
    env:
      vars:
        # Postgres e RabbitMQ são do repositório infrastructure (namespaces database e messaging)
        POSTGRES_HOST: postgres.database.svc.cluster.local
        POSTGRES_PORT: "5432"
        RABBITMQ_HOST: rabbitmq.messaging.svc.cluster.local
        # Fixed on purpose: Kubernetes injects POSTGRES_PORT=tcp://ip:port (service links),
        # which would otherwise override the numeric port.
        RABBITMQ_PORT: "5672"
        OTEL_SDK_DISABLED: "false"
        OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-gateway-collector.observability.svc.cluster.local:4317
      mapping:
        POSTGRES_PASSWORD:
          from-secret: erp-secrets
          with-key: postgres-password
        RABBITMQ_PASSWORD:
          from-secret: erp-secrets
          with-key: rabbitmq-password
    liveness-probe:
      http-action-path: /q/health/live
    readiness-probe:
      http-action-path: /q/health/ready

# --- RabbitMQ (quarkus-messaging-rabbitmq) ---
# Publisher: infra.messaging.StockEventPublisher; consumer: infra.messaging.CatalogEventsConsumer.
rabbitmq-host: ${RABBITMQ_HOST:localhost}
rabbitmq-port: ${RABBITMQ_PORT:5672}
rabbitmq-username: ${RABBITMQ_USER:root}
rabbitmq-password: "${RABBITMQ_PASSWORD:RabbitMQ123!}"

mp:
  messaging:
    outgoing:
      # Publishes with a per-message routing key to the durable topic exchange.
      stock-events:
        connector: smallrye-rabbitmq
        exchange:
          name: stock.events
          type: topic
          durable: true
    incoming:
      # Durable "stock-subscriber" queue bound to catalog.events. A nack is rejected
      # without requeue (same behaviour as the previous hand-rolled consumer).
      catalog-events:
        connector: smallrye-rabbitmq
        exchange:
          name: catalog.events
          type: topic
          durable: true
        queue:
          name: stock-subscriber
          durable: true
        routing-keys: product.created,product.updated,product.deleted
        max-outstanding-messages: 10
        failure-strategy: reject
      # Optional integrations (see infra.messaging.OrderEventsConsumer): confirmed sales / purchase orders create a
      # delivery / receipt. Each consumer declares the producer's exchange itself, so inventory starts the same
      # whether or not the sales / purchase modules are deployed.
      sales-events:
        connector: smallrye-rabbitmq
        exchange:
          name: sales.events
          type: topic
          durable: true
        queue:
          name: stock-subscriber-sales
          durable: true
        routing-keys: sales_order.confirmed,sales_order.cancelled
        max-outstanding-messages: 10
        failure-strategy: reject
      purchase-events:
        connector: smallrye-rabbitmq
        exchange:
          name: purchase.events
          type: topic
          durable: true
        queue:
          name: stock-subscriber-purchase
          durable: true
        routing-keys: purchase_order.confirmed,purchase_order.cancelled
        max-outstanding-messages: 10
        failure-strategy: reject

stock:
  outbox:
    relay:
      interval: 5s
  integration:
    # Stock (stock_<ULID>) that the automatic deliveries / receipts use; empty = the first stock created.
    default-stock: ${STOCK_DEFAULT_STOCK:}

app:
  i18n:
    # Fallback when Accept-Language is absent/unsupported. Bundles: i18n/messages_{pt_BR,en}.properties
    default-locale: pt-BR

"%dev":
  quarkus:
    # Dev Services de observabilidade (LGTM) exigem Docker e nada os consome; o OTel fica desligado em dev.
    observability:
      enabled: false

"%test":
  quarkus:
    flyway:
      migrate-at-start: false
